name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - name: shellcheck
        run: shellcheck -x fastup install.sh
      - name: Tests (bash 3.2)
        run: /bin/bash tests/run.sh
      - name: Checksum file for humans
        run: shasum -a 256 fastup > fastup.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" fastup fastup.sha256 --generate-notes
