name: upstream
# Daily live check: resolve, probe and download+verify every CLI from its real upstream, so an
# upstream change (renamed asset, moved manifest, new layout) is noticed before users hit it.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upstreams
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/upstream-check.sh 2>&1 | tee check.log; exit "${PIPESTATUS[0]}"
      - name: Open an issue on failure
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream check failed"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[].number')" ]; then
            { echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; echo '```'; tr '\r' '\n' <check.log | grep -v '%' | tail -40; echo '```'; } >body.md
            gh issue create --title "$title" --body-file body.md
          fi
