name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - name: shellcheck
        run: shellcheck -x fastup install.sh
      - name: Tests (bash 3.2)
        run: /bin/bash tests/run.sh
