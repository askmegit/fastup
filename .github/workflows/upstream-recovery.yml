name: upstream schedule recovery
# Keep this workflow separate from the scheduled check: GitHub can disable the latter after
# 60 days without repository activity, while this push/manual path remains available to re-enable it.
# A repository with no activity still needs a maintainer or an external scheduler to create an event.
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  actions: write
jobs:
  enable-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable upstream schedule
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable upstream.yml --repo "$GH_REPO"
